name: lint and test job 
on:
  push: # Triggers on push to any branch

jobs:
  lint: 
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4 # Note: v4 is the current stable recommended version
      
      - name: INSTALL LINTER
        run: pip install ruff
      
      - name: Runing Linter check
        run: ruff check .

  test: # Fixed indentation: aligned perfectly with lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
      
      - name: Runing test cases
        run: echo "Running test cases"

  summary: # This job runs only after both lint and test finish
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Print Pipeline Summary
        run: |
          echo "=== WORKFLOW SUMMARY ==="
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Branch Type: MAIN BRANCH PUSH"
          else
            echo "Branch Type: FEATURE BRANCH PUSH"
          fi
          
          echo "Current Branch: ${{ github.ref_name }}"
          echo "Commit Message: ${{ github.event.head_commit.message }}"
          echo "========================"
