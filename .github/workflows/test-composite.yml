name: Test Composite Action Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
    run_greeting:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository 
            uses: actions/checkout@v6

          - name: Run setup and greet action
            id: greet_step
            uses: ./.github/actions/setup-and-greet
            with:
              name: "John Doe"
              language: "es"
         
          - name: verify action output flag
            run: |
              echo "Was the user greeted successfully? ${{ steps.greet_step.outputs.greeted }}"