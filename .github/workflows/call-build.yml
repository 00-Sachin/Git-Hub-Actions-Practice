name: Caller_build Workflow
on:
    push:
      branches:
        - main
jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      app_name: "my-web-app"
      env: "production"
    secrets:
      docker_token: ${{ secrets.DOCKER_TOKEN }}
       
  verify_build:  
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 5. Read and print the build_version output
      - name: Print Reusable Workflow Output
        run: |
          echo "The version generated by the reusable workflow is: ${{ needs.build.outputs.build_version }}"   