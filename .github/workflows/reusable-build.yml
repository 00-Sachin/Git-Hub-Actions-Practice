name: Reusable Build Workflow

on:
  workflow_call:
    outputs:
      version:
        description: 'The build version generated by the workflow'
        value: ${{ jobs.build.outputs.version }}
    inputs:
      app_name:
        description: 'Name of the application to build'
        required: true
        type: string

      env:
        description: 'Environment to build for'
        required: true
        type: string
        default: staging   
    secrets:
      DOCKER_TOKEN:
        required: true
jobs:
 build:
   runs-on: ubuntu-latest
       # 2. Declare that this job outputs a variable named 'version'
   outputs:
      version: ${{ steps.gen_version.outputs.version }}
   steps:
    - name: Check out the repository code
      uses: actions/checkout@v6

    - name: Print build information
      run: | 
       echo "Building ${{ inputs.app_name }} for environment: ${{ inputs.env }}"

    - name: DOcker Token status
      run: |
       echo "Docker Token is set: true" 

    - name: Generate build version
      id: gen_version
      run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT