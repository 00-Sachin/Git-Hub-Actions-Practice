name: matrix

on:
  workflow_dispatch:

jobs:
  matrix-job:
    strategy:
      matrix:
        version: ['3.10', '3.11', '3.12']
        os: [ 'ubuntu-latest', 'windows-latest']
        
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code     
        uses: actions/checkout@v4

      - name: Install Python ${{ matrix.version }} on ${{ matrix.os }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}

      - name: Print Python Version
        run: python --version
