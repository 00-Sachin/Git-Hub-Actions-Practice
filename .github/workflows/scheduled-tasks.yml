name: Scheduled Workflows (Cron Deep Dive)
on:
  schedule:
    - cron: '30 2 * * 1' #(every Monday at 2:30 AM UTC)
    - cron: '0 */6 * * *' #(every 6 hours)
  workflow_dispatch:

jobs:
 printing:
    runs-on: ubuntu-latest
    steps:
      - name: print which schedule triggered
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "This workflow was triggered by the schedule: ${{ github.event.schedule }}"
          else
            echo "This workflow was triggered manually via workflow_dispatch."
          fi
      - name: Perform Health Check
        # Using curl to hit GitHub's status page as an example.
        # It captures the HTTP status code and fails the step if it's not 200.
        run: |
          URL="https://www.githubstatus.com/api/v2/status.json"
          echo "Checking health of $URL..."
          
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" "$URL")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Health check passed with status code: $HTTP_CODE"
          else
            echo "❌ Health check failed with status code: $HTTP_CODE"
            exit 1
          fi

