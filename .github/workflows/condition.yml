name: task 4 Conditional Workflow
on:
  workflow_dispatch:
jobs:
  conditional-job:
    runs-on: ubuntu-latest
    steps:
      - name: Runs only if the branch is main
        if: github.ref == 'refs/heads/main'
        run: echo "This step runs only on the main branch."

      # a custom failure step 
      - name: Custom Failure
        continue-on-error: true
        run: echo "This step will fail intentionally." && exit 1
        
      # a step that runs only if the previous step fails

      - name: Custom Failure Step
        if: failure()
        run: echo "This step runs only if the previous step fails." 

  push-event: 
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Push Event Step
        run: echo "This step runs only on push events." 
        
        
  
